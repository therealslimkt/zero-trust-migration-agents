version: '3.8'

services:
  as400-mock:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: legacy_db
    ports:
      - "5432:5432"
    volumes:
      - ./data:/docker-entrypoint-initdb.d
      - as400_data:/var/lib/postgresql/data

  maxdb-mock:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: legacy_db
    ports:
      - "3306:3306"
    volumes:
      - ./data:/docker-entrypoint-initdb.d
      - maxdb_data:/var/lib/mysql

  btrieve-mock:
    image: alpine:latest
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - ./data/btrieve:/legacy_data

volumes:
  as400_data:
  maxdb_data:
